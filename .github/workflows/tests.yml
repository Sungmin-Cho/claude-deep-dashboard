name: Tests

# Plugin-internal regression guard (companion to catalog-drift-check.yml,
# which covers cross-repo manifest drift). Runs on every PR + push to main:
#   - npm test                — node:test suite under lib/**/*.test.js
#   - npm run validate:envelope — M3 envelope contract self-test against the
#                                 positive fixture (tests/fixtures/...)
#   - npm run check:version-sync — guards plugin.json ↔ package.json drift
#                                  (envelope's producer_version SoT is
#                                  plugin.json; package.json must mirror)
#
# Node 22 on all supported hosts. Each lane also installs and verifies the
# supported Codex CLI and performs a real isolated release-candidate install.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.144.1

      - name: Verify pinned Codex CLI
        shell: pwsh
        run: |
          $actual = (& codex --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "codex --version failed: $LASTEXITCODE" }
          if ($actual -ne 'codex-cli 0.144.1') { throw "unexpected Codex CLI: $actual" }

      - name: Sanity print
        run: node -e "console.log('node ' + process.version)"

      - name: Version sync (plugin.json ↔ package.json)
        run: npm run check:version-sync

      - name: Envelope contract self-test
        run: npm run validate:envelope

      - name: Plugin unit tests (lib/**/*.test.js)
        run: npm test

      - name: Install and discover isolated Codex release candidate
        shell: pwsh
        run: |
          $script = Join-Path (Get-Location).Path 'scripts/validate-codex-release-candidate.js'
          node $script --candidate-root (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "candidate smoke failed: $LASTEXITCODE" }
